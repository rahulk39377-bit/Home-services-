<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BoltHome</title>
<meta name="theme-color" content="#0A2C6B">
<meta name="description" content="Trusted home services at your door - Electrician, Plumber, Cleaner">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue-900:#0A2C6B;
  --blue-700:#1450A3;
  --blue-600:#1B63D6;
  --blue-500:#2E7CF6;
  --blue-100:#E7F0FF;
  --yellow-500:#FFC629;
  --yellow-600:#F5A623;
  --ink:#0B1B33;
  --ink-soft:#5B6B85;
  --surface:#F6F8FC;
  --card:#FFFFFF;
  --border:#E4E9F3;
  --green:#1DA463;
  --red:#E4483A;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow:0 8px 24px rgba(10,44,107,0.10);
  --shadow-soft:0 2px 10px rgba(10,44,107,0.06);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--surface);
  color:var(--ink);
  overscroll-behavior:none;
}
h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
#viewport{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  background:var(--surface);
  position:relative;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
}
button{font-family:inherit; border:none; cursor:pointer; background:none;}
input,textarea{font-family:inherit; border:none; outline:none; background:none;}
::-webkit-scrollbar{display:none;}

/* ---------- SPLASH ---------- */
.splash{
  min-height:100vh; width:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(circle at 30% 20%, var(--blue-500), var(--blue-900) 70%);
  color:#fff; gap:18px; position:relative; overflow:hidden;
}
.splash::before{
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle at 80% 85%, rgba(255,198,41,0.18), transparent 40%),
    radial-gradient(circle at 10% 90%, rgba(255,255,255,0.06), transparent 35%);
}
.bolt-logo{
  width:88px; height:88px; border-radius:26px;
  background:linear-gradient(145deg, var(--yellow-500), var(--yellow-600));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 12px 30px rgba(255,198,41,0.45);
  animation:bounceIn 900ms cubic-bezier(.34,1.56,.64,1);
  z-index:1;
}
.bolt-logo svg{width:46px; height:46px;}
@keyframes bounceIn{
  0%{transform:scale(0.2) translateY(-40px); opacity:0;}
  60%{transform:scale(1.12) translateY(6px); opacity:1;}
  100%{transform:scale(1) translateY(0);}
}
.splash h1{font-size:26px; font-weight:800; letter-spacing:0.2px; z-index:1;}
.splash p{font-size:13.5px; color:rgba(255,255,255,0.8); z-index:1;}
.spinner{
  width:26px; height:26px; margin-top:10px;
  border:3px solid rgba(255,255,255,0.25);
  border-top-color:var(--yellow-500);
  border-radius:50%;
  animation:spin 800ms linear infinite;
  z-index:1;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- SHARED AUTH ---------- */
.auth-wrap{padding:40px 26px 26px; display:flex; flex-direction:column; min-height:100vh; animation:fadeIn 400ms ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.auth-logo{width:56px; height:56px; border-radius:16px; background:linear-gradient(145deg,var(--yellow-500),var(--yellow-600)); display:flex; align-items:center; justify-content:center; margin-bottom:20px; box-shadow:var(--shadow);}
.auth-logo svg{width:30px; height:30px;}
.auth-title{font-size:24px; font-weight:800; color:var(--blue-900); margin-bottom:4px;}
.auth-sub{font-size:13.5px; color:var(--ink-soft); margin-bottom:26px;}
.field{margin-bottom:14px;}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px;}
.field .input-box{
  display:flex; align-items:center; gap:10px;
  background:var(--card); border:1.5px solid var(--border);
  border-radius:var(--radius-md); padding:13px 14px;
  transition:border-color 150ms;
}
.field .input-box:focus-within{border-color:var(--blue-500); box-shadow:0 0 0 3px var(--blue-100);}
.field input{flex:1; font-size:14.5px; color:var(--ink);}
.field input::placeholder{color:#A7B2C6;}
.icon{width:18px; height:18px; flex-shrink:0; color:var(--ink-soft);}
.row-between{display:flex; justify-content:space-between; align-items:center; margin:2px 0 20px;}
.link-text{font-size:13px; color:var(--blue-600); font-weight:600;}
.btn-primary{
  width:100%; padding:15px; border-radius:var(--radius-md);
  background:linear-gradient(135deg, var(--blue-600), var(--blue-900));
  color:#fff; font-size:15px; font-weight:700;
  box-shadow:0 10px 20px rgba(20,80,163,0.28);
  transition:transform 120ms;
}
.btn-primary:active{transform:scale(0.97);}
.btn-outline{
  width:100%; padding:14px; border-radius:var(--radius-md);
  border:1.5px solid var(--border); background:#fff; color:var(--ink);
  font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:10px;
}
.divider{display:flex; align-items:center; gap:10px; margin:22px 0 16px; color:var(--ink-soft); font-size:12px;}
.divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--border);}
.social-row{display:flex; gap:12px;}
.social-row .btn-outline{flex:1;}
.bottom-note{text-align:center; margin-top:auto; padding-top:22px; font-size:13.5px; color:var(--ink-soft);}
.bottom-note b{color:var(--blue-600); font-weight:700;}
.checkbox-row{display:flex; align-items:flex-start; gap:10px; margin:6px 0 22px; font-size:12.5px; color:var(--ink-soft);}
.checkbox-row input{width:17px; height:17px; margin-top:1px; accent-color:var(--blue-600);}
.checkbox-row a{color:var(--blue-600); font-weight:600;}
.back-arrow{width:38px; height:38px; border-radius:12px; background:#fff; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; margin-bottom:18px;}

/* ---------- HOME ---------- */
.header{
  background:linear-gradient(120deg, var(--blue-700), var(--blue-900));
  padding:20px 20px 26px; color:#fff; border-radius:0 0 26px 26px;
  position:relative; overflow:hidden;
}
.header::after{content:''; position:absolute; right:-30px; top:-30px; width:140px; height:140px; border-radius:50%; background:rgba(255,198,41,0.14);}
.header-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; position:relative; z-index:1;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .bolt-mini{width:34px; height:34px; border-radius:10px; background:linear-gradient(145deg,var(--yellow-500),var(--yellow-600)); display:flex; align-items:center; justify-content:center;}
.brand .bolt-mini svg{width:18px; height:18px;}
.brand span{font-family:'Poppins',sans-serif; font-weight:700; font-size:16.5px;}
.bell-btn{width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; position:relative;}
.bell-dot{position:absolute; top:8px; right:9px; width:7px; height:7px; border-radius:50%; background:var(--yellow-500); border:1.5px solid var(--blue-900);}
.search-bar{
  display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.14);
  border-radius:var(--radius-md); padding:12px 14px; position:relative; z-index:1;
}
.search-bar input{flex:1; color:#fff; font-size:13.5px;}
.search-bar input::placeholder{color:rgba(255,255,255,0.65);}
.section{padding:20px;}
.type-toggle{display:flex; gap:8px; background:var(--blue-100); padding:5px; border-radius:14px; margin-bottom:18px;}
.type-pill{flex:1; text-align:center; padding:10px; border-radius:10px; font-size:13px; font-weight:700; color:var(--blue-700); transition:150ms;}
.type-pill.active{background:#fff; color:var(--blue-900); box-shadow:var(--shadow-soft);}
.partner-banner{
  margin-top:18px; display:flex; align-items:center; gap:12px;
  background:linear-gradient(120deg, var(--blue-700), var(--blue-900));
  border-radius:var(--radius-md); padding:16px; box-shadow:var(--shadow);
}
.partner-banner-text{flex:1;}
.partner-banner-title{color:#fff; font-size:13.5px; font-weight:700; margin-bottom:3px;}
.partner-banner-sub{color:rgba(255,255,255,0.75); font-size:11.5px;}
.section-title{font-size:15.5px; font-weight:700; margin-bottom:12px; color:var(--blue-900);}
.cat-scroll{display:flex; gap:12px; overflow-x:auto; padding-bottom:4px;}
.cat-chip{
  flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:7px;
  background:#fff; border:1.5px solid var(--border); border-radius:var(--radius-md);
  padding:12px 16px; min-width:76px; transition:120ms;
}
.cat-chip:active{transform:scale(0.95); border-color:var(--blue-500);}
.cat-chip .emoji{font-size:20px;}
.cat-chip span{font-size:11.5px; font-weight:600; color:var(--ink-soft);}
.book-cta{
  margin:22px 0 4px; width:100%; padding:17px; border-radius:var(--radius-lg);
  background:linear-gradient(135deg, var(--yellow-500), var(--yellow-600));
  color:var(--blue-900); font-size:15.5px; font-weight:800;
  display:flex; align-items:center; justify-content:center; gap:10px;
  box-shadow:0 12px 24px rgba(255,198,41,0.35);
}
.book-cta:active{transform:scale(0.98);}
.list-head{display:flex; justify-content:space-between; align-items:center; margin:24px 0 12px;}
.view-map-btn{font-size:12.5px; font-weight:700; color:var(--blue-600); display:flex; align-items:center; gap:5px;}
.elec-card{
  display:flex; align-items:center; gap:12px; background:#fff; border:1.5px solid var(--border);
  border-radius:var(--radius-md); padding:13px; margin-bottom:12px; box-shadow:var(--shadow-soft);
}
.avatar{
  width:52px; height:52px; border-radius:16px; flex-shrink:0;
  background:linear-gradient(145deg,var(--blue-500),var(--blue-900));
  color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px;
}
.elec-info{flex:1; min-width:0;}
.elec-info .name{font-size:14.5px; font-weight:700; color:var(--ink);}
.elec-meta{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft); margin-top:3px;}
.star{color:var(--yellow-600); font-weight:700;}
.avail-badge{font-size:10.5px; font-weight:700; color:var(--green); background:#E8F8EF; padding:3px 8px; border-radius:8px; margin-top:6px; display:inline-block;}
.chevron{color:var(--ink-soft);}
.bottom-nav{
  position:sticky; bottom:0; background:#fff; border-top:1px solid var(--border);
  display:flex; padding:10px 8px 14px; margin-top:auto; z-index:5;
}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-soft); font-size:10.5px; font-weight:600;}
.nav-item.active{color:var(--blue-600);}
.nav-item svg{width:21px; height:21px;}

/* ---------- MAP ---------- */
.map-screen{position:relative; height:100vh; display:flex; flex-direction:column;}
.map-canvas{
  flex:1; position:relative; overflow:hidden;
  background:
    linear-gradient(var(--border) 1px, transparent 1px) 0 0/34px 34px,
    linear-gradient(90deg, var(--border) 1px, transparent 1px) 0 0/34px 34px,
    #EAF1FF;
}
.map-top{position:absolute; top:16px; left:16px; right:16px; z-index:3; display:flex; gap:10px; align-items:center;}
.map-top .back-arrow{margin:0; background:#fff;}
.map-top .search-pill{flex:1; background:#fff; border-radius:14px; padding:12px 14px; font-size:13px; color:var(--ink-soft); box-shadow:var(--shadow-soft);}
.marker{position:absolute; transform:translate(-50%,-100%); cursor:pointer; text-align:center;}
.marker .pin{width:34px; height:34px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,0.25);}
.marker .pin span{transform:rotate(45deg); font-size:15px;}
.marker.me .pin{background:var(--blue-600); box-shadow:0 0 0 8px rgba(27,99,214,0.18);}
.marker.elec .pin{background:var(--yellow-500);}
.marker-pop{position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); background:#fff; padding:8px 12px; border-radius:10px; box-shadow:var(--shadow); white-space:nowrap; font-size:12px; font-weight:700; display:none;}
.marker.open .marker-pop{display:block;}
.zoom-fab{position:absolute; bottom:24px; right:18px; width:48px; height:48px; border-radius:50%; background:#fff; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; z-index:3;}
.map-bottom-card{position:absolute; bottom:0; left:0; right:0; background:#fff; border-radius:22px 22px 0 0; padding:18px 20px 26px; box-shadow:0 -6px 20px rgba(0,0,0,0.08); z-index:3;}

/* ---------- BOOKING FLOW ---------- */
.top-bar{display:flex; align-items:center; gap:12px; padding:18px 20px 6px;}
.top-bar h2{font-size:17px; font-weight:700; color:var(--blue-900);}
.progress-track{height:5px; background:var(--border); border-radius:6px; margin:12px 20px 4px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--blue-500),var(--blue-600)); border-radius:6px; transition:width 300ms;}
.step-label{padding:0 20px; font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; font-weight:600;}
.svc-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.svc-card{background:#fff; border:1.5px solid var(--border); border-radius:var(--radius-md); padding:16px; text-align:center;}
.svc-card.selected{border-color:var(--blue-500); background:var(--blue-100);}
.svc-card .emoji{font-size:26px; margin-bottom:8px;}
.svc-card span{font-size:12.5px; font-weight:700;}
.textarea-box{background:#fff; border:1.5px solid var(--border); border-radius:var(--radius-md); padding:14px; font-size:13.5px; width:100%; min-height:90px; resize:none;}
.slot-row{display:flex; gap:10px;}
.slot-chip{flex:1; padding:13px; border-radius:var(--radius-md); border:1.5px solid var(--border); background:#fff; text-align:center; font-size:13px; font-weight:700;}
.slot-chip.selected{background:var(--blue-600); color:#fff; border-color:var(--blue-600);}
.price-card{background:linear-gradient(120deg,var(--blue-100),#fff); border:1.5px solid var(--blue-100); border-radius:var(--radius-md); padding:16px; display:flex; justify-content:space-between; align-items:center; margin-top:6px;}
.price-card .label{font-size:12px; color:var(--ink-soft); font-weight:600;}
.price-card .amount{font-size:19px; font-weight:800; color:var(--blue-900);}
.bottom-fixed{position:sticky; bottom:0; background:#fff; padding:16px 20px 22px; border-top:1px solid var(--border); margin-top:auto;}

.modal-overlay{position:fixed; inset:0; background:rgba(10,20,40,0.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:24px;}
.modal-card{background:#fff; border-radius:24px; padding:30px 24px; text-align:center; max-width:340px; width:100%; animation:popIn 300ms cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(0.85); opacity:0;} to{transform:scale(1); opacity:1;}}
.check-circle{width:64px; height:64px; border-radius:50%; background:#E8F8EF; display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
.modal-card h3{font-size:17px; margin-bottom:8px; color:var(--blue-900);}
.modal-card p{font-size:13.5px; color:var(--ink-soft); margin-bottom:22px; line-height:1.5;}

/* ---------- BOOKINGS ---------- */
.tabs{display:flex; gap:8px; padding:16px 20px 6px;}
.tab-btn{flex:1; padding:11px; border-radius:12px; font-size:13px; font-weight:700; background:#fff; border:1.5px solid var(--border); color:var(--ink-soft);}
.tab-btn.active{background:var(--blue-900); color:#fff; border-color:var(--blue-900);}
.booking-card{background:#fff; border:1.5px solid var(--border); border-radius:var(--radius-md); padding:16px; margin:0 20px 14px;}
.booking-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
.booking-top .svc{font-size:14.5px; font-weight:700;}
.status-pill{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:8px;}
.status-confirmed{background:#E7F0FF; color:var(--blue-600);}
.status-transit{background:#FFF6E0; color:var(--yellow-600);}
.status-done{background:#E8F8EF; color:var(--green);}
.booking-meta{font-size:12px; color:var(--ink-soft); margin-bottom:4px;}
.booking-actions{display:flex; gap:10px; margin-top:12px;}
.mini-btn{flex:1; padding:9px; border-radius:10px; font-size:12px; font-weight:700; text-align:center;}
.mini-btn.cancel{background:#FDEBEA; color:var(--red);}
.mini-btn.track{background:var(--blue-900); color:#fff;}
.empty-state{text-align:center; padding:50px 30px; color:var(--ink-soft);}
.empty-state .emoji{font-size:38px; margin-bottom:12px;}

/* ---------- ELECTRICIAN PROFILE ---------- */
.profile-hero{background:linear-gradient(120deg,var(--blue-700),var(--blue-900)); padding:20px 20px 60px; border-radius:0 0 30px 30px; position:relative;}
.profile-avatar{
  width:84px; height:84px; border-radius:22px; margin:20px auto 12px;
  background:linear-gradient(145deg,var(--yellow-500),var(--yellow-600));
  display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; color:var(--blue-900);
  box-shadow:0 10px 24px rgba(0,0,0,0.25);
}
.profile-hero h2{color:#fff; text-align:center; font-size:19px; font-weight:700;}
.verified-row{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:4px;}
.verified-badge{font-size:11px; background:rgba(255,255,255,0.18); color:#fff; padding:3px 9px; border-radius:8px; font-weight:700;}
.stat-card{
  background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow); margin:-40px 20px 0; padding:18px; position:relative; z-index:2;
  display:flex; justify-content:space-around; text-align:center;
}
.stat-card .stat b{display:block; font-size:16px; color:var(--blue-900);}
.stat-card .stat span{font-size:11px; color:var(--ink-soft);}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.skill-chip{background:var(--blue-100); color:var(--blue-700); font-size:12px; font-weight:700; padding:7px 13px; border-radius:10px;}
.about-text{font-size:13px; color:var(--ink-soft); line-height:1.6;}
.review-card{background:#fff; border:1.5px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:10px;}
.review-top{display:flex; justify-content:space-between; margin-bottom:6px; font-size:13px; font-weight:700;}
.review-text{font-size:12.5px; color:var(--ink-soft);}

/* ---------- PROFILE / SETTINGS ---------- */
.profile-card-top{background:#fff; margin:20px; border-radius:var(--radius-lg); padding:20px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow-soft);}
.profile-card-top .avatar{width:58px; height:58px; font-size:19px;}
.profile-card-top .name{font-size:15.5px; font-weight:700;}
.profile-card-top .email{font-size:12px; color:var(--ink-soft);}
.menu-list{margin:0 20px; background:#fff; border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-soft);}
.menu-item{display:flex; align-items:center; gap:14px; padding:16px 18px; border-bottom:1px solid var(--border); font-size:14px; font-weight:600;}
.menu-item:last-child{border-bottom:none;}
.menu-item svg{width:19px; height:19px; color:var(--blue-600);}
.menu-item.logout{color:var(--red);}
.menu-item.logout svg{color:var(--red);}
.menu-item .chevron{margin-left:auto;}

/* ---------- PAYMENT ---------- */
.pay-method{
  display:flex; align-items:center; gap:14px;
  background:#fff; border:1.5px solid var(--border);
  border-radius:var(--radius-md); padding:16px; margin-bottom:12px;
  transition:150ms; cursor:pointer;
}
.pay-method.selected{border-color:var(--blue-500); background:var(--blue-100);}
.pay-method .pay-icon{
  width:44px; height:44px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; flex-shrink:0;
}
.pay-method .pay-info{flex:1;}
.pay-method .pay-title{font-size:14.5px; font-weight:700;}
.pay-method .pay-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.pay-radio{
  width:22px; height:22px; border-radius:50%;
  border:2px solid var(--border); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.pay-method.selected .pay-radio{border-color:var(--blue-600); background:var(--blue-600);}
.pay-method.selected .pay-radio::after{
  content:''; width:8px; height:8px; border-radius:50%; background:#fff;
}
.pay-summary{
  background:linear-gradient(120deg,var(--blue-100),#fff);

.invoice-wrap{padding:20px; background:var(--surface); min-height:100vh;}
.invoice-card{

.inv-table .right{text-align:right;}

}

}

  const vp = document.getElementById('viewport');

  const screens = {
    splash: renderSplash,
    login: renderLogin,
    signup: renderSignup,
    home: renderHome,
    map: renderMap,

    proProfile: renderProProfile,
    profile: renderProfile,

  };

        <div style="background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-bottom:14px">

          <div style="font-weight:700;font-size:15px;margin-top:2px">${svc.emoji} ${svc.label}</div>
          <div style="font-size:13px;color:var(--ink-soft);margin-top:10px">Time</div>
          <div style="font-weight:700;font-size:15px;margin-top:2px">${state.selectedSlot || '—'}</div>
          ${state.bookingNote ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:10px">Note</div><div style="font-size:13.5px;margin-top:2px">${state.bookingNote}</div>` : ''}
        </div>
        <div class="price-card">
          <div>
            <div class="label">Estimated total</div>
            <div style="font-size:11px;color:var(--ink-soft)">Includes service charge</div>
          </div>
          <div class="amount">₹${svc.price}</div>
        </div>
      </div>
    `;

    <div style="display:flex;flex-direction:column;min-height:100vh">
      <div class="top-bar">
        <button class="back-arrow" style="margin:0" id="book-back">${ICONS.back}</button>
        <h2>${t('bookPrefix')} ${data.label}</h2>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
      ${content}
      <div class="bottom-fixed">
        <button class="btn-primary" id="book-next">${step === 4 ? 'Proceed to Payment' : 'Continue'}</button>
      </div>
    </div>
  `);

  d.querySelector('#book-back').onclick = () => {
    if (step === 1) { state.screen = 'home'; render(); }
    else { state.bookingStep--; render(); }

    d.querySelectorAll('.svc-card').forEach(c => {
      c.onclick = () => {
        state.selectedService = +c.dataset.idx;
        render();
      };
    });
  }
  if (step === 2) {
    const ta = d.querySelector('#note');
    ta.oninput = () => { state.bookingNote = ta.value; };
  }
  if (step === 3) {
    d.querySelectorAll('.slot-chip').forEach(c => {
      c.onclick = () => {
        state.selectedSlot = c.dataset.slot;
        render();
      };
    });
  }

  d.querySelector('#book-next').onclick = () => {
    if (step === 1 && state.selectedService === null) return alert('Please select a service');
    if (step === 3 && !state.selectedSlot) return alert('Please choose a time slot');
    if (step < 4) {
      state.bookingStep++;
      render();
    } else {
      const svc = data.services[state.selectedService];
      state.pendingBooking = {
        id: Date.now(),
        service: svc.label,

        date: state.selectedSlot,
        status: 'confirmed',
        price: svc.price,
        serviceAmount: svc.price,
        note: state.bookingNote,
        paid: false,
        paymentMethod: null,
        invoiceNo: null
      };
      state.paymentMethod = 'upi';
      state.screen = 'payment';
      render();
    }
  };
  return d;
}

function renderPayment() {
  const b = state.pendingBooking;
  if (!b) { state.screen = 'home'; return renderHome(); }

  const commission = calcCommission(b.price);
  const total = b.price + commission;
  const upiUri = `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(UPI_PAYEE_NAME)}&am=${total}&cu=INR&tn=${encodeURIComponent(b.service + ' booking')}`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(upiUri)}`;

  const methods = [
    { id: 'upi', icon: '📱', bg: '#E8F8EF', title: 'UPI', sub: 'GPay, PhonePe, Paytm' },
    { id: 'card', icon: '💳', bg: '#E7F0FF', title: 'Credit / Debit Card', sub: 'Visa, Mastercard, RuPay' },
    { id: 'wallet', icon: '👛', bg: '#FFF6E0', title: 'BoltHome Wallet', sub: 'Balance: ₹1,250' },
    { id: 'cod', icon: '💵', bg: '#F5F5F5', title: 'Pay after service', sub: 'Cash or UPI on completion' },
  ];

  const d = el(`
    <div style="display:flex;flex-direction:column;min-height:100vh">
      <div class="top-bar">
        <button class="back-arrow" style="margin:0" id="pay-back">${ICONS.back}</button>
        <h2>Payment</h2>
      </div>

      <div style="padding:8px 20px 20px;flex:1">
        <div class="pay-summary">
          <div class="pay-row"><span>Service</span><span style="font-weight:600;color:var(--ink)">${b.emoji || '⚡'} ${b.service}</span></div>
          <div class="pay-row"><span>Time slot</span><span style="font-weight:600;color:var(--ink)">${b.date}</span></div>
          <div class="pay-row"><span>Service charge</span><span>₹${b.price}</span></div>
          <div class="pay-row"><span>Platform fee (15%)</span><span>₹${commission}</span></div>
          <div class="pay-row total"><span>Total payable</span><span>₹${total}</span></div>
        </div>

        <div class="section-title">Select payment method</div>
        ${methods.map(m => `
          <div class="pay-method ${state.paymentMethod === m.id ? 'selected' : ''}" data-method="${m.id}">
            <div class="pay-icon" style="background:${m.bg}">${m.icon}</div>
            <div class="pay-info">
              <div class="pay-title">${m.title}</div>
              <div class="pay-sub">${m.sub}</div>
            </div>
            <div class="pay-radio"></div>
          </div>
        `).join('')}

        ${state.paymentMethod === 'upi' ? `
          <div style="background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-md);padding:18px;margin-top:14px;text-align:center">
            <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;font-weight:600">Scan &amp; Pay ₹${total}</div>
            <img src="${qrUrl}" alt="UPI QR Code" width="180" height="180" style="border-radius:12px;border:1px solid var(--border)">
            <div style="font-size:13px;font-weight:700;margin-top:12px;color:var(--blue-900)">${UPI_ID}</div>
            <button class="btn-outline" id="upi-copy" style="margin-top:10px">📋 Copy UPI ID</button>
            <button class="btn-primary" id="upi-open" style="margin-top:10px">${ICONS.boltWhite} Open in UPI App</button>
          </div>
        ` : ''}
      </div>

      <div class="bottom-fixed">
        <button class="btn-primary" id="pay-now">
          ${state.paymentMethod === 'cod' ? 'Confirm Booking' : state.paymentMethod === 'upi' ? "I've Paid — Confirm" : `Pay ₹${total}`}
        </button>
      </div>
    </div>
  `);

  d.querySelector('#pay-back').onclick = () => {
    state.screen = 'booking';
    state.bookingStep = 4;
    render();
  };

  d.querySelectorAll('.pay-method').forEach(el => {
    el.onclick = () => {
      state.paymentMethod = el.dataset.method;
      render();
    };
  });

  const upiOpenBtn = d.querySelector('#upi-open');
  if (upiOpenBtn) {
    upiOpenBtn.onclick = () => { window.location.href = upiUri; };
  }
  const upiCopyBtn = d.querySelector('#upi-copy');
  if (upiCopyBtn) {
    upiCopyBtn.onclick = () => {
      navigator.clipboard?.writeText(UPI_ID).then(() => {
        upiCopyBtn.textContent = '✓ Copied!';
        setTimeout(() => { upiCopyBtn.innerHTML = '📋 Copy UPI ID'; }, 1500);
      }).catch(() => alert('UPI ID: ' + UPI_ID));
    };
  }

  d.querySelector('#pay-now').onclick = () => {
    const methodLabels = { upi: 'UPI', card: 'Card', wallet: 'Wallet', cod: 'Pay later' };
    const isPaid = state.paymentMethod !== 'cod';
    const invNo = 'INV-2026-' + String(b.id).slice(-4);

    const finalBooking = {
      ...b,
      paid: isPaid,
      paymentMethod: methodLabels[state.paymentMethod],
      invoiceNo: invNo,
      serviceAmount: b.serviceAmount != null ? b.serviceAmount : b.price,
      price: (b.serviceAmount != null ? b.serviceAmount : b.price) + calcCommission(b.serviceAmount != null ? b.serviceAmount : b.price),
      status: 'confirmed'
    };
    state.bookings.unshift(finalBooking);
    state.pendingBooking = null;

    // Success modal
    const overlay = el(`
      <div class="modal-overlay">
        <div class="modal-card">
          <div class="check-circle">${ICONS.check}</div>
          <h3>${isPaid ? 'Payment Successful!' : 'Booking Confirmed!'}</h3>
          <p>${isPaid
            ? `₹${finalBooking.price} paid via ${finalBooking.paymentMethod}. Invoice ${invNo} generated.`
            : 'Pay after the service is completed. We\'ve notified nearby electricians.'}</p>
          <button class="btn-primary" id="view-inv" style="margin-bottom:10px">${isPaid ? 'View Invoice' : 'View Bookings'}</button>
          ${isPaid ? '<button class="btn-outline" id="go-bookings">Go to Bookings</button>' : ''}
        </div>
      </div>
    `);
    document.getElementById('viewport').appendChild(overlay);

    if (isPaid) {
      overlay.querySelector('#view-inv').onclick = () => {
        state.invoiceBooking = finalBooking;
        state.screen = 'invoice';
        render();
      };
      overlay.querySelector('#go-bookings').onclick = () => {
        state.screen = 'bookings';
        state.activeTab = 'upcoming';
        render();
      };
    } else {
      overlay.querySelector('#view-inv').onclick = () => {
        state.screen = 'bookings';
        state.activeTab = 'upcoming';
        render();
      };
    }
  };

  return d;
}

function renderBookings() {
  const upcoming = state.bookings.filter(b => b.status !== 'done');
  const past = state.bookings.filter(b => b.status === 'done');
  const list = state.activeTab === 'upcoming' ? upcoming : past;

  const d = el(`
    <div style="display:flex;flex-direction:column;min-height:100vh">
      <div class="top-bar" style="padding-bottom:4px">
        <h2 style="margin:0">${t('myBookings')}</h2>
      </div>
      <div class="tabs">
        <button class="tab-btn ${state.activeTab === 'upcoming' ? 'active' : ''}" data-tab="upcoming">${t('upcoming')}</button>
        <button class="tab-btn ${state.activeTab === 'past' ? 'active' : ''}" data-tab="past">${t('past')}</button>
      </div>
      <div style="flex:1;padding-bottom:12px">
        ${list.length === 0 ? `
          <div class="empty-state">
            <div class="emoji">📋</div>
            <div>${t('noBookings')}</div>
          </div>
        ` : list.map(b => `
          <div class="booking-card" data-bid="${b.id}">
            <div class="booking-top">
              <div class="svc">${b.service}</div>
              <span class="status-pill status-${b.status === 'done' ? 'done' : b.status === 'transit' ? 'transit' : 'confirmed'}">
                ${b.status === 'done' ? 'Completed' : b.status === 'transit' ? 'On the way' : 'Confirmed'}
              </span>
            </div>
            <div class="booking-meta">👤 ${b.pro}</div>
            <div class="booking-meta">🕐 ${b.date}</div>
            <div class="booking-meta">₹${b.price}${b.paid ? ' · Paid' : b.paymentMethod === 'Pay later' ? ' · Pay later' : ''}</div>
            <div class="booking-actions">
              ${b.status !== 'done' ? `
                <button class="mini-btn cancel" data-action="cancel">${t('cancel')}</button>
                <button class="mini-btn track" data-action="track">${t('track')}</button>
              ` : ''}
              ${b.paid && b.invoiceNo ? `
                <button class="mini-btn track" data-action="invoice" style="${b.status !== 'done' ? '' : 'flex:1'}">${t('invoice')}</button>
              ` : !b.paid && b.paymentMethod === 'Pay later' ? `
                <button class="mini-btn track" data-action="pay" style="flex:1">${t('payNow')}</button>
              ` : b.paid ? `
                <button class="mini-btn track" data-action="invoice" style="flex:1">${t('viewInvoice')}</button>
              ` : ''}
            </div>
          </div>
        `).join('')}
      </div>
      ${renderBottomNav('bookings')}
    </div>
  `);

  d.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      state.activeTab = btn.dataset.tab;
      render();
    };
  });

  d.querySelectorAll('[data-action]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const card = btn.closest('.booking-card');
      const bid = +card.dataset.bid;
      const booking = state.bookings.find(x => x.id === bid);
      if (!booking) return;

      if (btn.dataset.action === 'invoice') {
        state.invoiceBooking = booking;
        state.screen = 'invoice';
        render();
      } else if (btn.dataset.action === 'pay') {
        const sa = booking.serviceAmount != null ? booking.serviceAmount : Math.round(booking.price / (1 + COMMISSION_RATE));
        state.pendingBooking = { ...booking, price: sa, serviceAmount: sa };
        state.paymentMethod = 'upi';
        state.screen = 'payment';
        render();
      } else if (btn.dataset.action === 'cancel') {
        if (confirm('Cancel this booking?')) {
          state.bookings = state.bookings.filter(x => x.id !== bid);
          render();
        }
      } else if (btn.dataset.action === 'track') {
        alert('Live tracking will open here\nElectrician is on the way!');
      }
    };
  });

  return d;
}

function renderBottomNav(active) {
  return `
    <div class="bottom-nav">
      <button class="nav-item ${active === 'home' ? 'active' : ''}" data-nav="home">${ICONS.home}<span>${t('home')}</span></button>

      <button class="nav-item ${active === 'map' ? 'active' : ''}" data-nav="map">${ICONS.map}<span>${t('map')}</span></button>
      <button class="nav-item ${active === 'profile' ? 'active' : ''}" data-nav="profile">${ICONS.profile}<span>${t('profile')}</span></button>
    </div>
  `;
}

/* ---------------- EVENT DELEGATION FOR NAV ---------------- */
document.getElementById('viewport').addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    const screen = nav.dataset.nav;
    if (screen === 'map') state.screen = 'map';
    else if (screen === 'home') state.screen = 'home';
    else if (screen === 'bookings') state.screen = 'bookings';
    else if (screen === 'profile') state.screen = 'profile';
    render();
  }
});

/* ---------------- START ---------------- */
render();

/* ---------------- PWA SERVICE WORKER ---------------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
